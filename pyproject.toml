[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-desktop"
version = "1.0.0"
description = "ECHO desktop accessibility snapshot parser + agent-desktop CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
windows = ["pywinauto>=0.6.8", "uiautomation>=2.0.18"]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
agent-desktop = "snapshot_parser.cli:main"

[tool.setuptools]
packages = ["snapshot_parser", "snapshot_parser.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
